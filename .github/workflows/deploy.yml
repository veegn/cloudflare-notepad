name: Deploy cloud-notepad

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Error: CLOUDFLARE_API_TOKEN secret is missing!"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build:frontend:prod

      - name: Deploy to Cloudflare
        id: deploy_to_cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Output deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_to_cf.outputs.deployment-url }}
        run: echo "::notice::Deployment successful! ${DEPLOYMENT_URL}"
