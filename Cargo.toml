[package]
name = "cloudflare-notepad"
version = "0.1.0"
edition = "2021"
description = "Cloudflare Workers backend for Cloud Notepad"
license = "MIT"
repository = "https://github.com/veegn/cloudflare-notepad"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers runtime
worker = "0.8.7"
worker-macros = { version = "0.8.7", features = ["http"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Template engine (pure Rust, WASM-compatible)
tera = "2.4.0"

# Crypto — all pure Rust, no `ring` (ring doesn't compile to wasm32)
hmac = "0.13.0"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
md-5 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"

# Random number generation in WASM
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# JS interop (for Date.now() in WASM)
js-sys = "0.3.107"

# Concurrent R2 metadata GETs (join_all)
futures = "0.3.34"

# Utilities
urlencoding = "2.1.3"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
