<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Blue background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#3b82f6"/>
  
  <!-- Notepad Shadow -->
  <rect x="116" y="146" width="280" height="300" rx="24" fill="#2563eb"/>
  
  <!-- Notepad Paper -->
  <rect x="116" y="136" width="280" height="300" rx="24" fill="#ffffff"/>
  
  <!-- Notepad Holes -->
  <circle cx="176" cy="168" r="14" fill="#3b82f6"/>
  <circle cx="256" cy="168" r="14" fill="#3b82f6"/>
  <circle cx="336" cy="168" r="14" fill="#3b82f6"/>
  
  <!-- Spiral Rings -->
  <rect x="164" y="96" width="24" height="72" rx="12" fill="#334155"/>
  <rect x="244" y="96" width="24" height="72" rx="12" fill="#334155"/>
  <rect x="324" y="96" width="24" height="72" rx="12" fill="#334155"/>
  
  <!-- Paper Lines -->
  <rect x="156" y="220" width="200" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="156" y="270" width="200" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="156" y="320" width="200" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="156" y="370" width="120" height="12" rx="6" fill="#e2e8f0"/>
  
  <!-- Pencil -->
  <g transform="translate(360, 230) rotate(45)" filter="url(#shadow)">
    <!-- Eraser -->
    <path d="M-20,-12 C-20,-24 -12,-32 0,-32 C12,-32 20,-24 20,-12 L20,0 L-20,0 Z" fill="#f87171"/>
    <!-- Band -->
    <rect x="-20" y="0" width="40" height="16" fill="#94a3b8"/>
    <!-- Body left -->
    <rect x="-20" y="16" width="20" height="120" fill="#fbbf24"/>
    <!-- Body right -->
    <rect x="0" y="16" width="20" height="120" fill="#f59e0b"/>
    <!-- Wood -->
    <polygon points="-20,136 20,136 0,180" fill="#fde68a"/>
    <!-- Lead -->
    <polygon points="-6,166 6,166 0,180" fill="#334155"/>
  </g>
</svg>
