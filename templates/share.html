{% extends "base.html" %}

{% block editor_content %}
<div class="composer-frame is-reading mode-{{ metadata.mode | default(value='plain') }}" data-mode="{{ metadata.mode | default(value='plain') }}">
  <div class="composer-main">
    <div class="composer-preview-scroll" id="preview-scroll">
      <div id="preview" class="composer-preview" aria-hidden="false">
        <pre class="document-source"><code>{{ content }}</code></pre>
      </div>
    </div>
  </div>
</div>
{% endblock editor_content %}
